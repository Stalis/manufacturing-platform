base_subject: manufacturing
services:
  producer:
    streams:
      commands:
        name: PRODUCTION_COMMANDS
        retention: workqueue
        
        subjects:
          start_v1:
            subject: producer.tasks.start.v1
            model: Producer.Contracts.Models.ProducerTaskV1
      
        consumers:
          - durable_name: 'producer-worker'
            filter_subjects:
              - producer.tasks.start.>
      
      events:
        name: PRODUCTION_EVENTS
        retention: limits
        
        subjects:
          started_v1:
            subject: producer.events.started.v1
            model: Producer.Contracts.Models.ProducerEventV1
          completed_v1:
            subject: producer.events.completed.v1
            model: Producer.Contracts.Models.ProducerEventV1
          failed_v1:
            subject: producer.events.failed.v1
            model: Producer.Contracts.Models.ProducerEventV1
          invalid_v1:
            subject: producer.events.invalid.v1
            model: Producer.Contracts.Models.ProducerEventV1
          stopped_v1:
            subject: producer.events.stopped.v1
            model: Producer.Contracts.Models.ProducerEventV1

        consumers:
          - durable_name: 'orders-api-producer'
            for_service: orders
            filter_subjects:
              - producer.events.>
          - durable_name: 'gateway-api-producer'
            for_service: gateway
            filter_subjects:
              - producer.events.>

  inventory:
    core_subjects:
      reserve_v1:
        subject: inventory.tasks.reserve.v1
        model: Inventory.Contracts.Models.InventoryReserveTaskV1
        reply_model: Inventory.Contracts.Models.InventoryReserveReplyV1
        queue_group: inventory-worker
      release_v1:
        subject: inventory.tasks.release.v1
        model: Inventory.Contracts.Models.InventoryReleaseTaskV1
        reply_model: Inventory.Contracts.Models.InventoryReleaseReplyV1
        queue_group: inventory-worker
    streams:
      commands:
        name: INVENTORY_COMMANDS
        retention: workqueue
        
        subjects:
          grab_v1:
            subject: inventory.tasks.grab.v1
            model: Inventory.Contracts.Models.InventoryGrabTaskV1
        
        consumers:
          - durable_name: 'inventory-worker'
            filter_subjects:
              - inventory.tasks.grab.>

      events:
        name: INVENTORY_EVENTS
        retention: limits
        
        subjects:
          delivered_v1:
            subject: inventory.events.delivered.v1
            model: Inventory.Contracts.Models.InventoryDeliveredEventV1
        
        consumers:
          - durable_name: 'producer-worker-inventory'
            for_service: producer
            filter_subjects:
              - inventory.events.delivered.>
  